      <stop offset="1" stop-color="#29D3C3"/>
    </linearGradient>
    <linearGradient id="cardR" gradientUnits="userSpaceOnUse" x1="130" y1="70" x2="205" y2="160">
      <stop offset="0" stop-color="#FF9E86"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="57" y1="85" x2="72" y2="101">
      <stop offset="0" stop-color="#FFDC7A"/>
      <stop offset="1" stop-color="#FFC83D"/>
    </linearGradient>
  </defs>

