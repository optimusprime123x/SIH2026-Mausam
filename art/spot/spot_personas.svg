<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- Onboarding "what matters to you": three fanned cards (indigo / teal / coral) with sun, raindrop and leaf.
       Outer cards are the middle card rotated +-30 deg around (120,190); geometry pre-rotated (no transforms). Light from top-left. -->
  <defs>
    <linearGradient id="cardL" gradientUnits="userSpaceOnUse" x1="40" y1="70" x2="115" y2="160">
      <stop offset="0" stop-color="#8F9CFF"/>
      <stop offset="1" stop-color="#6B7BFF"/>
    </linearGradient>
    <linearGradient id="cardM" gradientUnits="userSpaceOnUse" x1="90" y1="56" x2="150" y2="146">
