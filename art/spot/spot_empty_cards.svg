<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- "No cards yet": a stack of three rounded cards (violet, indigo, white) with a mint plus badge on top.
       Back cards pre-rotated (-8, -4 deg). Light from top-left. -->
  <defs>
    <linearGradient id="cardBack" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="170" y2="120">
      <stop offset="0" stop-color="#C0ACFF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cardMid" gradientUnits="userSpaceOnUse" x1="62" y1="56" x2="172" y2="130">
      <stop offset="0" stop-color="#8F9CFF"/>
      <stop offset="1" stop-color="#6B7BFF"/>
    </linearGradient>
    <linearGradient id="thumb" gradientUnits="userSpaceOnUse" x1="76" y1="84" x2="106" y2="110">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="badge" gradientUnits="userSpaceOnUse" x1="160" y1="66" x2="184" y2="92">
      <stop offset="0" stop-color="#7CE0A9"/>
      <stop offset="1" stop-color="#29D3C3"/>
    </linearGradient>
  </defs>

  <!-- backdrop blobs -->
  <path fill="#4CC2FF" fill-opacity="0.2" d="M30,108 C24,60 70,24 128,28 C186,32 226,68 218,118 C210,168 156,192 100,184 C50,177 36,154 30,108 Z"/>
  <path fill="#A78BFA" fill-opacity="0.2" d="M6,140 C6,116 28,102 50,108 C72,114 80,138 68,158 C56,178 28,180 14,166 C8,160 6,150 6,140 Z"/>

  <!-- back card (violet) -->
  <path fill="#0078D4" fill-opacity="0.14" d="M69.4,52.2 L152.58,40.51 A14,14 0 0 1 168.39,52.42 L174.52,95.99 A14,14 0 0 1 162.6,111.8 L79.42,123.49 A14,14 0 0 1 63.61,111.58 L57.48,68.01 A14,14 0 0 1 69.4,52.2 Z"/>
  <path fill="url(#cardBack)" d="M67.4,48.2 L150.58,36.51 A14,14 0 0 1 166.39,48.42 L172.52,91.99 A14,14 0 0 1 160.6,107.8 L77.42,119.49 A14,14 0 0 1 61.61,107.58 L55.48,64.01 A14,14 0 0 1 67.4,48.2 Z"/>
  <!-- middle card (indigo) -->
  <path fill="#0078D4" fill-opacity="0.16" d="M74.59,64.02 L158.39,58.16 A14,14 0 0 1 173.33,71.15 L176.4,115.04 A14,14 0 0 1 163.41,129.98 L79.61,135.84 A14,14 0 0 1 64.67,122.85 L61.6,78.96 A14,14 0 0 1 74.59,64.02 Z"/>
  <path fill="url(#cardMid)" d="M72.59,60.02 L156.39,54.16 A14,14 0 0 1 171.33,67.15 L174.4,111.04 A14,14 0 0 1 161.41,125.98 L77.61,131.84 A14,14 0 0 1 62.67,118.85 L59.6,74.96 A14,14 0 0 1 72.59,60.02 Z"/>
  <!-- front card (white) -->
  <path fill="#0078D4" fill-opacity="0.18" d="M80,76 L164,76 A14,14 0 0 1 178,90 L178,134 A14,14 0 0 1 164,148 L80,148 A14,14 0 0 1 66,134 L66,90 A14,14 0 0 1 80,76 Z"/>
  <path fill="#DCE6F2" d="M80,74 L164,74 A14,14 0 0 1 178,88 L178,132 A14,14 0 0 1 164,146 L80,146 A14,14 0 0 1 66,132 L66,88 A14,14 0 0 1 80,74 Z"/>
  <path fill="#FFFFFF" d="M78,72 L162,72 A14,14 0 0 1 176,86 L176,130 A14,14 0 0 1 162,144 L78,144 A14,14 0 0 1 64,130 L64,86 A14,14 0 0 1 78,72 Z"/>
  <!-- front card content: weather thumbnail + text lines -->
  <rect x="76" y="84" width="30" height="26" rx="8" fill="url(#thumb)"/>
  <circle cx="86" cy="94" r="5" fill="#FFC83D"/>
  <rect x="84" y="99" width="16" height="6" rx="3" fill="#FFFFFF"/>
  <circle cx="92" cy="98" r="4.5" fill="#FFFFFF"/>
  <rect x="112" y="88" width="42" height="7" rx="3.5" fill="#DCE6F2"/>
  <rect x="112" y="101" width="28" height="7" rx="3.5" fill="#DCE6F2"/>
  <rect x="76" y="120" width="64" height="7" rx="3.5" fill="#DCE6F2"/>
  <rect x="76" y="132" width="40" height="6" rx="3" fill="#4CC2FF" fill-opacity="0.55"/>

  <!-- plus badge -->
  <circle cx="173" cy="80" r="19" fill="#0078D4" fill-opacity="0.16"/>
  <circle cx="172" cy="78" r="19" fill="#FFFFFF"/>
  <circle cx="172" cy="78" r="15.5" fill="url(#badge)"/>
  <path fill="#FFFFFF" d="M165.5,75.5 L178.5,75.5 A2.5,2.5 0 0 1 181,78 A2.5,2.5 0 0 1 178.5,80.5 L165.5,80.5 A2.5,2.5 0 0 1 163,78 A2.5,2.5 0 0 1 165.5,75.5 Z"/>
  <path fill="#FFFFFF" d="M172,69 A2.5,2.5 0 0 1 174.5,71.5 L174.5,84.5 A2.5,2.5 0 0 1 172,87 A2.5,2.5 0 0 1 169.5,84.5 L169.5,71.5 A2.5,2.5 0 0 1 172,69 Z"/>

  <!-- sparkles -->
  <path fill="#FFC83D" d="M44,58 C45,64.5 47,66.5 53.5,67.5 C47,68.5 45,70.5 44,77 C43,70.5 41,68.5 34.5,67.5 C41,66.5 43,64.5 44,58 Z"/>
  <path fill="#FF6B9A" d="M204,120 C204.7,124.5 206,125.6 210.5,126.3 C206,127 204.7,128.2 204,132.6 C203.3,128.2 202,127 197.5,126.3 C202,125.6 203.3,124.5 204,120 Z"/>
  <circle cx="200" cy="44" r="3" fill="#29D3C3"/>
  <circle cx="40" cy="120" r="2.6" fill="#FF7A59"/>
  <circle cx="150" cy="170" r="2.4" fill="#A78BFA"/>
</svg>
