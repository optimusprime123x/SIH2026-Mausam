<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- "Offline / bundled sample data": muted lavender cloud carrying a broken (dashed) wifi symbol with a rose slash.
       Wifi centre is (120,112); arcs are annular sectors. Light from top-left. -->
  <defs>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="80" y1="70" x2="170" y2="150">
      <stop offset="0" stop-color="#F1EEFF"/>
      <stop offset="1" stop-color="#D6CFF8"/>
    </linearGradient>
    <linearGradient id="slash" gradientUnits="userSpaceOnUse" x1="100" y1="80" x2="140" y2="122">
      <stop offset="0" stop-color="#FF8AB0"/>
      <stop offset="1" stop-color="#FF6B9A"/>
    </linearGradient>
  </defs>

  <!-- backdrop blobs -->
  <path fill="#A78BFA" fill-opacity="0.24" d="M28,110 C22,62 68,26 126,30 C186,34 226,70 218,120 C210,168 156,192 100,184 C50,177 34,154 28,110 Z"/>
  <path fill="#6B7BFF" fill-opacity="0.18" d="M150,150 C160,128 190,124 208,138 C226,152 226,180 208,190 C190,200 162,194 152,178 C146,168 146,160 150,150 Z"/>

  <!-- cloud shade (offset to bottom-right) -->
  <rect x="64" y="112" width="120" height="28" rx="14" fill="#B9AEF3"/>
  <circle cx="92" cy="110" r="26" fill="#B9AEF3"/>
  <circle cx="128" cy="94" r="35" fill="#B9AEF3"/>
  <circle cx="162" cy="114" r="22" fill="#B9AEF3"/>
  <!-- cloud body -->
  <rect x="60" y="108" width="120" height="28" rx="14" fill="url(#cloud)"/>
  <circle cx="88" cy="106" r="26" fill="url(#cloud)"/>
  <circle cx="124" cy="90" r="35" fill="url(#cloud)"/>
  <circle cx="158" cy="110" r="22" fill="url(#cloud)"/>

  <!-- wifi arcs (broken into dashes), indigo -->
  <circle cx="120" cy="112" r="5" fill="#6B7BFF"/>
  <path fill="#6B7BFF" d="M107.98,99.98 A17,17 0 0 1 132.02,99.98 A2.5,2.5 0 0 1 128.49,103.51 A12,12 0 0 0 111.51,103.51 A2.5,2.5 0 0 1 107.98,99.98 Z"/>
  <path fill="#6B7BFF" d="M100.91,92.91 A27,27 0 0 1 116.24,85.26 A2.5,2.5 0 0 1 116.94,90.21 A22,22 0 0 0 104.44,96.44 A2.5,2.5 0 0 1 100.91,92.91 Z"/>
  <path fill="#6B7BFF" d="M123.76,85.26 A27,27 0 0 1 139.09,92.91 A2.5,2.5 0 0 1 135.56,96.44 A22,22 0 0 0 123.06,90.21 A2.5,2.5 0 0 1 123.76,85.26 Z"/>
  <path fill="#6B7BFF" fill-opacity="0.7" d="M93.84,85.84 A37,37 0 0 1 107.35,77.23 A2.5,2.5 0 0 1 109.06,81.93 A32,32 0 0 0 97.37,89.37 A2.5,2.5 0 0 1 93.84,85.84 Z"/>
  <path fill="#6B7BFF" fill-opacity="0.7" d="M112.31,75.81 A37,37 0 0 1 127.69,75.81 A2.5,2.5 0 0 1 126.65,80.7 A32,32 0 0 0 113.35,80.7 A2.5,2.5 0 0 1 112.31,75.81 Z"/>
  <path fill="#6B7BFF" fill-opacity="0.7" d="M132.65,77.23 A37,37 0 0 1 146.16,85.84 A2.5,2.5 0 0 1 142.63,89.37 A32,32 0 0 0 130.94,81.93 A2.5,2.5 0 0 1 132.65,77.23 Z"/>

  <!-- slash: a cloud-coloured gap first, then the rose bar -->
  <path fill="url(#cloud)" d="M94.05,84.95 L136.05,126.95 A7,7 0 0 1 145.95,117.05 L103.95,75.05 A7,7 0 0 1 94.05,84.95 Z"/>
  <path fill="url(#slash)" d="M96.88,82.12 L138.88,124.12 A3,3 0 0 1 143.12,119.88 L101.12,77.88 A3,3 0 0 1 96.88,82.12 Z"/>

  <!-- muted sparkles / drifting dots -->
  <circle cx="52" cy="70" r="3" fill="#A78BFA"/>
  <circle cx="196" cy="60" r="2.6" fill="#6B7BFF"/>
  <circle cx="40" cy="146" r="2.2" fill="#4CC2FF"/>
  <circle cx="184" cy="160" r="2.4" fill="#A78BFA"/>
  <path fill="#A78BFA" fill-opacity="0.8" d="M186,32 C187,38 189,40 195,41 C189,42 187,44 186,50 C185,44 183,42 177,41 C183,40 185,38 186,32 Z"/>
</svg>
